# ":80" = plain HTTP on the Elastic IP until DNS is ready. Set to "pigeon-pulse.com"
# once its A record points at the server; Caddy then fetches the HTTPS cert itself.
domain: ":80"
app_url: "{{ ('http://' ~ public_ip) if domain == ':80' else ('https://' ~ domain) }}"

repo_url: https://github.com/infps/pigeon_pulse.git # public repo: no GitHub key needed on the box
repo_branch: main
app_dir: /opt/pigeon_pulse
app_tag: latest # or a commit sha to roll back: -e app_tag=<sha>

pg_client_version: "17" # >= both Neon and RDS major versions

# Who can SSH (via SSM) as ubuntu. EXCLUSIVE: a key removed here is revoked on the
# next site.yml run. Add a teammate = append their public key, run site.yml.
team_ssh_keys:
  - "ssh-rsa  sounak"
