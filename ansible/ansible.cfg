[defaults]
inventory = inventory.ini
interpreter_python = auto_silent

[ssh_connection]
# SSH rides an SSM session: port 22 is closed, no IP allow-list. Needs the AWS CLI,
# session-manager-plugin and AWS_PROFILE pointing at a pigeonpulse-deployers user.
ssh_args = -o ProxyCommand="aws ssm start-session --region us-west-2 --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p" -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
