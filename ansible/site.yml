# Provision + deploy. Re-run to ship the latest `main`:  ansible-playbook site.yml --ask-vault-pass
- name: Pigeon Pulse app server
  hosts: app
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/base.yml

    - name: App dir owned by ubuntu
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Team SSH keys (exclusive — removing a key revokes access)
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ team_ssh_keys | join('\n') }}"
        exclusive: true

    - name: Checkout app
      become: false
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        accept_newhostkey: true
      register: checkout

    - name: Write .env
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        mode: "0600"
      register: env

    # Image is built by GitHub Actions (pigeon_pulse/.github/workflows/docker-image.yml).
    # Building here OOM-kills the running app on the 2 GB box. Compose recreates the
    # container only when the image digest or .env changed.
    - name: Pull image + start
      ansible.builtin.command: docker compose up -d --pull always
      args:
        chdir: "{{ app_dir }}"
      register: up
      changed_when: "'Recreate' in up.stderr or 'Creat' in up.stderr"

    - name: Wait for app (migrations run on boot)
      ansible.builtin.command: >-
        docker compose exec -T app node -e
        "fetch('http://localhost:3000/api/ping').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      args:
        chdir: "{{ app_dir }}"
      register: ping
      until: ping.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Daily notify cron (replaces Vercel cron, 09:00 UTC)
      ansible.builtin.cron:
        name: notify-daily
        hour: "9"
        minute: "0"
        job: >-
          docker compose -f {{ app_dir }}/docker-compose.yml exec -T app node -e
          "fetch('http://localhost:3000/api/cron/notify-daily', {headers: {authorization: 'Bearer ' + process.env.CRON_SECRET}}).then(r => process.exit(r.ok ? 0 : 1))"

    - name: Prune old images
      ansible.builtin.command: docker image prune -f
      when: up.changed
